# Builds the herdbox-ocr packages (linux/windows × amd64/arm64), tests each on
# its own platform and, for a tag v<N>, publishes them with SHA256SUMS on the
# tag's release. Core pins the printed sums in automation/ocr/pin.go of
# herdbox/core.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  VCPKG_COMMIT: 93ad765c7b66ab9ce97469ec23a90b15c3a14ee5
  LLVM_MINGW: '20261117'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64, triplet: x64-linux }
          - { runner: ubuntu-22.04-arm, goos: linux, goarch: arm64, triplet: arm64-linux }
          - { runner: windows-2025, goos: windows, goarch: amd64, triplet: x64-mingw-static, mingw: x86_64 }
          - { runner: windows-11-arm, goos: windows, goarch: arm64, triplet: arm64-mingw-static, mingw: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0' }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      PKG: herdbox-ocr-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Version
        shell: bash
        # Tag v1 → package 1; v1-rc1 → 1.
        run: |
          v=${VERSION#v}
          echo "VERSION=${v%%-*}" >>"$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('build/vcpkg.json', 'build/triplets/*') }}

      - name: vcpkg
        shell: bash
        run: |
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = Windows ]; then "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics; else "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics; fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >>"$GITHUB_ENV"

      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config autoconf automake libtool nasm zip unzip
          pip3 install --user cmake==3.31.6 ninja==1.11.1.4
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >>"$GITHUB_ENV"

      - name: llvm-mingw
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW-ucrt-${{ matrix.mingw }}"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW/$name.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$name\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        env:
          OUT: ${{ github.workspace }}/out
        run: |
          build/build.sh
          build/test.sh 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OUT: ${{ github.workspace }}\out
        run: |
          ./build/build.ps1
          $env:HERDBOX_OCR_PKG_DIR = "$env:OUT\pkg-windows-$env:GOARCH"
          go test -count=1 -tags e2e -v ./... 2>&1 | Tee-Object "$env:RUNNER_TEMP\test.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: glibc floor (Debian 12)
        if: runner.os == 'Linux'
        env:
          OUT: ${{ github.workspace }}/out
        run: |
          source build/cgo-env.sh && cgo_flags
          go test -c -tags e2e -o out/e2e.test .
          docker run --rm -v "$PWD:/w" -w /w -e HERDBOX_OCR_PKG_DIR=/w/out/pkg-linux-$GOARCH debian:12 \
            /w/out/e2e.test -test.run 'SettingsFixture|VietnameseSet' -test.v

      - name: Summary
        shell: bash
        run: |
          zip=$(ls out/herdbox-ocr-*-${{ matrix.goos }}-${{ matrix.goarch }}.zip)
          {
            echo "### ${{ matrix.goos }}/${{ matrix.goarch }}"
            echo '```'
            ls -l "$zip"
            grep -E 'items in|warm|peak RSS|exact lines' "$RUNNER_TEMP/test.log" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: out/herdbox-ocr-*-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum herdbox-ocr-*.zip >SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          pre=""
          case "$TAG" in *-rc*) pre=--prerelease ;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "herdbox-ocr package ${TAG#v}" $pre
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber herdbox-ocr-*.zip SHA256SUMS
